[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pottery-volume"
version = "0.1.6"
description = "土器実測図から回転体の容量と器壁体積を推定するツール"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.2,<3",
    "opencv-python-headless>=4.10,<6",
    "scikit-image>=0.25,<1",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.20,<2",
    "PySide6>=6.8,<7",
    "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pyinstaller>=6.22,<7",
    "ruff>=0.12,<1",
    "pyright>=1.1.400,<2",
    "mypy>=1.10,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "pottery_volume",
    "pottery_volume_cli",
    "pottery_volume_core",
    "pottery_volume_geometry",
    "pottery_scale",
    "pottery_volume_gui",
    "pottery_volume_gui_helpers",
    "pottery_volume_gui_qt",
    "pottery_volume_gui_workers",
    "pottery_volume_gui_window",
    "pottery_volume_gui_profiles",
    "pottery_volume_gui_scale",
    "pottery_volume_gui_style",
    "pottery_volume_updater",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["build", "dist", ".venv", ".venv-build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = [
    "src/pottery_volume.py",
    "src/pottery_volume_cli.py",
    "src/pottery_volume_core.py",
    "src/pottery_volume_geometry.py",
    "src/pottery_scale.py",
    "src/pottery_volume_gui.py",
    "src/pottery_volume_gui_helpers.py",
    "src/pottery_volume_gui_qt.py",
    "src/pottery_volume_gui_workers.py",
    "src/pottery_volume_gui_window.py",
    "src/pottery_volume_gui_profiles.py",
    "src/pottery_volume_gui_scale.py",
    "src/pottery_volume_gui_style.py",
    "src/pottery_volume_updater.py",
]
exclude = ["build", "dist", ".venv", ".venv-build", "tests"]
reportMissingTypeStubs = false
reportUnsupportedDunderAll = false

[tool.mypy]
python_version = "3.14"
files = [
    "src/pottery_volume_geometry.py",
    "src/pottery_volume_core.py",
    "src/pottery_volume_gui_helpers.py",
    "src/pottery_volume_gui_workers.py",
    "src/pottery_volume_updater.py",
    "src/pottery_scale.py",
    "src/pottery_volume_cli.py",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pottery_volume_geometry", "pottery_volume_gui_helpers"]
strict = true

[[tool.mypy.overrides]]
module = ["pottery_volume_gui_workers"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
