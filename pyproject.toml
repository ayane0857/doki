[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pottery-volume"
version = "0.1.0"
description = "土器実測図から回転体の容量と器壁体積を推定するツール"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.5.4",
    "opencv-python-headless==5.0.0.93",
    "scikit-image==0.26.0",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "rapidocr==3.10.0",
    "onnxruntime==1.31.1",
    "PySide6==6.10.1",
    "shapely==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pyinstaller==6.22.3",
    "ruff>=0.12,<1",
    "pyright>=1.1.400,<2",
    "mypy>=1.10,<2",
]

[tool.setuptools]
py-modules = [
    "pottery_volume",
    "pottery_volume_cli",
    "pottery_volume_core",
    "pottery_volume_geometry",
    "pottery_scale",
    "pottery_volume_gui",
    "pottery_volume_gui_helpers",
    "pottery_volume_gui_qt",
    "pottery_volume_gui_workers",
    "pottery_volume_gui_window",
    "pottery_volume_gui_profiles",
    "pottery_volume_gui_scale",
    "pottery_volume_gui_style",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["build", "dist", ".venv", ".venv-build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = [
    "pottery_volume.py",
    "pottery_volume_cli.py",
    "pottery_volume_core.py",
    "pottery_volume_geometry.py",
    "pottery_scale.py",
    "pottery_volume_gui.py",
    "pottery_volume_gui_helpers.py",
    "pottery_volume_gui_qt.py",
    "pottery_volume_gui_workers.py",
    "pottery_volume_gui_window.py",
    "pottery_volume_gui_profiles.py",
    "pottery_volume_gui_scale.py",
]
exclude = ["build", "dist", ".venv", ".venv-build", "tests"]
reportMissingTypeStubs = false
reportUnsupportedDunderAll = false

[tool.mypy]
python_version = "3.14"
files = [
    "pottery_volume_geometry.py",
    "pottery_volume_gui_helpers.py",
    "pottery_volume_gui_workers.py",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pottery_volume_geometry", "pottery_volume_gui_helpers"]
strict = true

[[tool.mypy.overrides]]
module = ["pottery_volume_gui_workers"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
