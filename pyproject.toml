[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pottery-volume"
version = "0.1.8"
description = "土器実測図から回転体の容量と器壁体積を推定するツール"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.2,<3",
    "opencv-python-headless>=4.10,<6",
    "scikit-image>=0.25,<1",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.20,<2",
    "PySide6>=6.8,<7",
    "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pyinstaller>=6.22,<7",
    "ruff>=0.12,<1",
    "pyright>=1.1.400,<2",
    "mypy>=1.10,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["pottery_volume", "pottery_volume_cli"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["doki", "doki.*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["build", "dist", ".venv", ".venv-build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["build", "dist", ".venv", ".venv-build", "tests"]
reportMissingTypeStubs = false
reportUnsupportedDunderAll = false

[tool.mypy]
python_version = "3.14"
files = [
    "src/doki/analysis",
    "src/doki/scale",
    "src/doki/cli.py",
    "src/doki/gui/helpers.py",
    "src/doki/gui/workers.py",
    "src/doki/updater.py",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["doki.analysis.geometry", "doki.gui.helpers"]
strict = true

[[tool.mypy.overrides]]
module = ["doki.gui.workers"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
