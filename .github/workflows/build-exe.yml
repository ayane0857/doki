name: Test and Build PotteryVolume Setup

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*" # v1.0.0 などのタグを打った時だけ公開処理が走る
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # タグ(公開ビルド)は途中キャンセルしない
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pyright
      - run: python -m mypy

  build:
    needs: [test, static-analysis]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\pip"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Build EXE
        shell: cmd
        run: build_exe.bat

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer
        shell: pwsh
        run: ./build.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: PotteryVolume-Setup
          path: dist/PotteryVolume-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Prepare online payload
        id: prepare-payload
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python prepare_payload.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zipHash = (Get-FileHash -Algorithm SHA256 "PotteryVolume-GUI-Windows.zip").Hash.ToLowerInvariant()
          $fields = (Get-Content -Raw -Encoding ascii "PotteryVolume-GUI-Windows.zip.sha256").Trim().Split()
          if ($fields.Count -eq 0 -or $fields[0] -notmatch '^[0-9a-fA-F]{64}$') {
            throw "Prepared payload checksum metadata is invalid"
          }
          if ($fields[0].ToLowerInvariant() -ne $zipHash) {
            throw "Prepared payload ZIP/checksum mismatch"
          }
          $setupPath = "dist/PotteryVolume-Setup.exe"
          if (-not (Test-Path -LiteralPath $setupPath)) {
            throw "Built installer is missing: $setupPath"
          }
          $setupHash = (Get-FileHash -Algorithm SHA256 $setupPath).Hash.ToLowerInvariant()
          Set-Content -Path "$setupPath.sha256" -Value "$setupHash  PotteryVolume-Setup.exe" -NoNewline -Encoding ascii

      - name: Upload online payload by FTP
        id: publish-payload
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && steps.prepare-payload.outcome == 'success'
        shell: pwsh
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Curl {
            param([Parameter(Mandatory)][string[]] $Arguments)
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              & curl.exe @Arguments
              if ($LASTEXITCODE -eq 0) {
                return
              }
              if ($attempt -lt 5) {
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
            throw "curl failed after 5 attempts"
          }

          if (-not $env:FTP_HOST -or -not $env:FTP_USERNAME -or -not $env:FTP_PASSWORD) {
            throw "FTP_HOST, FTP_USERNAME, and FTP_PASSWORD secrets are required."
          }

          $hostName = $env:FTP_HOST -replace '^ftp://', '' -replace '/+$', ''
          $port = if ($env:FTP_PORT) { $env:FTP_PORT } else { "21" }
          $version = "${{ github.sha }}"
          $releaseDir = "/public_html/app/doki/windows/releases/$version"
          $releaseParent = "/public_html/app/doki/windows/releases"
          $stagingName = ".$version.$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT"
          $stagingDir = "$releaseParent/$stagingName"
          $pointerUrl = "ftp://${hostName}:${port}/public_html/app/doki/windows/latest/release.txt"
          $credentials = "$($env:FTP_USERNAME):$($env:FTP_PASSWORD)"

          $releaseFiles = @(
            "PotteryVolume-GUI-Windows.zip",
            "PotteryVolume-GUI-Windows.zip.sha256",
            "PotteryVolume-Setup.exe",
            "PotteryVolume-Setup.exe.sha256"
          )
          $remoteFiles = @{}
          $anyRemoteFileExists = $false
          foreach ($fileName in $releaseFiles) {
            $remoteFile = Join-Path $env:RUNNER_TEMP "remote-$version-$fileName"
            $remoteUrl = "ftp://${hostName}:${port}${releaseDir}/$fileName"
            & curl.exe --fail --silent --show-error --ssl-reqd --ftp-pasv --retry 5 --retry-delay 10 --retry-all-errors --keepalive-time 30 --user $credentials --output $remoteFile $remoteUrl *> $null
            $remoteFiles[$fileName] = @{ path = $remoteFile; exists = ($LASTEXITCODE -eq 0) }
            $anyRemoteFileExists = $anyRemoteFileExists -or $remoteFiles[$fileName].exists
          }

          if ($anyRemoteFileExists) {
            foreach ($fileName in $releaseFiles) {
              if (-not $remoteFiles[$fileName].exists) {
                throw "Immutable release is incomplete: $version ($fileName)"
              }
            }
            foreach ($fileName in @("PotteryVolume-GUI-Windows.zip", "PotteryVolume-Setup.exe")) {
              $checksumFile = "$fileName.sha256"
              $remoteHash = (Get-FileHash -Algorithm SHA256 $remoteFiles[$fileName].path).Hash.ToLowerInvariant()
              $checksumFields = (Get-Content -Raw -Encoding ascii $remoteFiles[$checksumFile].path).Trim().Split()
              if ($checksumFields.Count -eq 0 -or $checksumFields[0] -notmatch '^[0-9a-fA-F]{64}$') {
                throw "Immutable release checksum is invalid: $version ($checksumFile)"
              }
              if ($remoteHash -ne $checksumFields[0].ToLowerInvariant()) {
                throw "Immutable release file/checksum mismatch: $version ($fileName)"
              }
            }
          } else {
            foreach ($fileName in $releaseFiles) {
              $url = "ftp://${hostName}:${port}${stagingDir}/$fileName"
              $localPath = if ($fileName.StartsWith("PotteryVolume-GUI-")) { $fileName } else { "dist/$fileName" }
              Invoke-Curl @(
                "--fail", "--silent", "--show-error", "--ssl-reqd", "--ftp-pasv",
                "--retry", "5", "--retry-delay", "10", "--retry-all-errors",
                "--keepalive-time", "30", "--ftp-create-dirs",
                "--user", $credentials, "--upload-file", $localPath, $url
              )
            }

            Invoke-Curl @(
              "--fail", "--silent", "--show-error", "--ssl-reqd", "--ftp-pasv",
              "--retry", "5", "--retry-delay", "10", "--retry-all-errors",
              "--keepalive-time", "30", "--user", $credentials,
              "--quote", "RNFR $stagingDir",
              "--quote", "RNTO $releaseDir",
              "ftp://${hostName}:${port}/"
            )
          }

          if ($env:GITHUB_REF -eq "refs/heads/master") {
            $pointerFile = Join-Path $env:RUNNER_TEMP "release.txt"
            Set-Content -Path $pointerFile -Value $version -NoNewline -Encoding ascii
            $pointerTempUrl = "ftp://${hostName}:${port}/public_html/app/doki/windows/latest/.release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.txt"
            Invoke-Curl @(
              "--fail", "--silent", "--show-error", "--ssl-reqd", "--ftp-pasv",
              "--retry", "5", "--retry-delay", "10", "--retry-all-errors",
              "--keepalive-time", "30", "--ftp-create-dirs",
              "--user", $credentials, "--upload-file", $pointerFile, $pointerTempUrl
            )
            Invoke-Curl @(
              "--fail", "--silent", "--show-error", "--ssl-reqd", "--ftp-pasv",
              "--retry", "5", "--retry-delay", "10", "--retry-all-errors",
              "--keepalive-time", "30", "--user", $credentials,
              "--quote", "RNFR /public_html/app/doki/windows/latest/.release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.txt",
              "--quote", "RNTO /public_html/app/doki/windows/latest/release.txt",
              "ftp://${hostName}:${port}/"
            )
          }

      - name: Publish installer to GitHub Release
        if: github.ref_type == 'tag' && steps.prepare-payload.outcome == 'success' && steps.publish-payload.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              dist/PotteryVolume-Setup.exe `
              --title "PotteryVolume Windows Setup" `
              --notes "Japanese per-user installer for PotteryVolume. The GUI checks for updates when started." `
              --target $env:GITHUB_SHA `
              --prerelease `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release upload $tag `
              dist/PotteryVolume-Setup.exe `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
