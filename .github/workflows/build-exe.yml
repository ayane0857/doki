name: Test and Build Windows EXE

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

# 連続push時に古いビルドを自動キャンセルしてキュー待ち・ランナー消費を削減
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Pyright
        run: python -m pyright

      - name: Run mypy
        run: python -m mypy

  build:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [test, static-analysis]
    runs-on: windows-latest

    steps:
      # Windows Defenderのリアルタイム保護による大量ファイルI/Oの遅延を防止（必ずcheckout前に実行）
      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\pip"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Build EXE
        shell: cmd
        run: build_exe.bat

      # Compress-Archiveを廃止し、upload-artifactの並列ストリーミング圧縮・アップロードに直接任せる
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PotteryVolume_ScaleOCR-${{ github.sha }}
          path: dist/PotteryVolume_ScaleOCR
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
