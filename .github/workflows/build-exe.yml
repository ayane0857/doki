name: Test and Build Windows EXE

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*" # v1.0.0 などのタグを打った時だけ公開処理が走る
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # タグ(公開ビルド)は途中キャンセルしない
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pyright
      - run: python -m mypy

  build:
    needs: [test, static-analysis]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\pip"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Build EXE
        shell: cmd
        run: build_exe.bat

      - name: Prepare online payload
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: python prepare_bootstrap_payload.py

      - name: Upload online payload by FTP
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          if (-not $env:FTP_HOST -or -not $env:FTP_USERNAME -or -not $env:FTP_PASSWORD) {
            throw "FTP_HOST, FTP_USERNAME, and FTP_PASSWORD secrets are required."
          }

          $hostName = $env:FTP_HOST -replace '^ftp://', '' -replace '/+$', ''
          $port = if ($env:FTP_PORT) { $env:FTP_PORT } else { "21" }
          $version = "${{ github.sha }}"
          $releaseDir = "/app/doki/windows/releases/$version"
          $credentials = "$($env:FTP_USERNAME):$($env:FTP_PASSWORD)"

          foreach ($fileName in @(
            "PotteryVolume-GUI-Windows.zip",
            "PotteryVolume-GUI-Windows.zip.sha256"
          )) {
            $url = "ftp://${hostName}:${port}${releaseDir}/$fileName"
            & curl.exe --fail --silent --show-error --ssl-reqd --ftp-create-dirs --user $credentials --upload-file $fileName $url
            if ($LASTEXITCODE -ne 0) {
              throw "FTP upload failed: $fileName"
            }
          }

          $pointerFile = Join-Path $env:RUNNER_TEMP "release.txt"
          Set-Content -Path $pointerFile -Value $version -NoNewline -Encoding ascii
          $pointerUrl = "ftp://${hostName}:${port}/app/doki/windows/latest/release.txt"
          & curl.exe --fail --silent --show-error --ssl-reqd --ftp-create-dirs --user $credentials --upload-file $pointerFile $pointerUrl
          if ($LASTEXITCODE -ne 0) {
            throw "FTP upload failed: release.txt"
          }

      - name: Upload bootstrap Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PotteryVolume-Windows-Bootstrap-${{ github.sha }}
          path: dist/PotteryVolume_bootstrap.exe
          if-no-files-found: error
          compression-level: 0 # EXEは圧縮しても縮まず時間の無駄
          retention-days: 14

      - name: Publish bootstrap EXE to GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "continuous-windows"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/PotteryVolume_bootstrap.exe `
              --title "PotteryVolume Windows (bootstrap)" `
              --notes "Small online bootstrap EXE. The application is downloaded from the configured FTP server on first launch." `
              --target $env:GITHUB_SHA `
              --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release upload $tag dist/PotteryVolume_bootstrap.exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
