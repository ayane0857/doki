name: Build Windows EXE

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Build EXE
        shell: cmd
        run: build_exe.bat

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/PotteryVolume_ScaleOCR -DestinationPath dist/PotteryVolume_ScaleOCR.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PotteryVolume_ScaleOCR-${{ github.sha }}
          path: dist/PotteryVolume_ScaleOCR.zip
          if-no-files-found: error
