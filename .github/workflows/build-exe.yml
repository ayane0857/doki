name: Test and Build PotteryVolume Setup

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*" # v1.0.0 などのタグを打った時だけ公開処理が走る
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # タグ(公開ビルド)は途中キャンセルしない
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pyright
      - run: python -m mypy

  build:
    needs: [test, static-analysis]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\pip"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Build EXE
        shell: cmd
        run: build\build_exe.bat

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer
        shell: pwsh
        run: ./build/build.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: PotteryVolume-Setup
          path: build/dist/PotteryVolume-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Prepare online payload
        id: prepare-payload
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python build/prepare_payload.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zipHash = (Get-FileHash -Algorithm SHA256 "build/PotteryVolume-GUI-Windows.zip").Hash.ToLowerInvariant()
          $fields = (Get-Content -Raw -Encoding ascii "build/PotteryVolume-GUI-Windows.zip.sha256").Trim().Split()
          if ($fields.Count -eq 0 -or $fields[0] -notmatch '^[0-9a-fA-F]{64}$') {
            throw "Prepared payload checksum metadata is invalid"
          }
          if ($fields[0].ToLowerInvariant() -ne $zipHash) {
            throw "Prepared payload ZIP/checksum mismatch"
          }
          $setupPath = "build/dist/PotteryVolume-Setup.exe"
          if (-not (Test-Path -LiteralPath $setupPath)) {
            throw "Built installer is missing: $setupPath"
          }
          $setupHash = (Get-FileHash -Algorithm SHA256 $setupPath).Hash.ToLowerInvariant()
          Set-Content -Path "$setupPath.sha256" -Value "$setupHash  PotteryVolume-Setup.exe" -NoNewline -Encoding ascii

      - name: Publish rolling GitHub Release
        id: publish-payload
        if: github.ref == 'refs/heads/master' && steps.prepare-payload.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "latest"
          $releaseFile = Join-Path $env:RUNNER_TEMP "PotteryVolume-release.txt"
          Set-Content -Path $releaseFile -Value "${{ github.sha }}" -NoNewline -Encoding ascii
          $assets = @(
            "build/PotteryVolume-GUI-Windows.zip",
            "build/PotteryVolume-GUI-Windows.zip.sha256",
            "build/dist/PotteryVolume-Setup.exe",
            "build/dist/PotteryVolume-Setup.exe.sha256",
            $releaseFile
          )

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @assets `
              --title "PotteryVolume latest" `
              --notes "Rolling Windows build from master. Assets are updated by GitHub Actions." `
              --target $env:GITHUB_SHA `
              --prerelease `
              --repo $env:GITHUB_REPOSITORY
          } else {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish installer to GitHub Release
        if: github.ref_type == 'tag' && steps.prepare-payload.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "build/PotteryVolume-GUI-Windows.zip",
            "build/PotteryVolume-GUI-Windows.zip.sha256",
            "build/dist/PotteryVolume-Setup.exe",
            "build/dist/PotteryVolume-Setup.exe.sha256"
          )
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              $assets `
              --title "PotteryVolume Windows Setup" `
              --notes "Japanese per-user installer and update payload for PotteryVolume." `
              --target $env:GITHUB_SHA `
              --prerelease `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release upload $tag `
              $assets `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
