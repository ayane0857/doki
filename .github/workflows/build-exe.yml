name: Build Windows EXE

on:
  push:

permissions:
  contents: read

# 連続push時に古いビルドを自動キャンセルしてキュー待ち・ランナー消費を削減
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Windows Defenderのリアルタイム保護による大量ファイルI/Oの遅延を防止（必ずcheckout前に実行）
      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\pip"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Build EXE
        shell: cmd
        run: build_exe.bat

      # Compress-Archiveを廃止し、upload-artifactの並列ストリーミング圧縮・アップロードに直接任せる
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PotteryVolume_ScaleOCR-${{ github.sha }}
          path: dist/PotteryVolume_ScaleOCR
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
